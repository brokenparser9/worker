name: dork-swarm

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Number of workers (1-15)"
        required: true
        default: "5"
        type: string

      pages:
        description: "Pages per dork"
        required: true
        default: "5"
        type: string

      delay:
        description: "Delay seconds between pages"
        required: true
        default: "4"
        type: string

      job_id:
        description: "Brain Hub job ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: brain-hub-${{ github.repository }}
  cancel-in-progress: false

jobs:

  setup:
    name: Prepare workers
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Validate inputs
        env:
          WORKERS: ${{ inputs.workers }}
          PAGES: ${{ inputs.pages }}
          DELAY: ${{ inputs.delay }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys

          workers = int(os.environ["WORKERS"])
          pages = int(os.environ["PAGES"])
          delay = float(os.environ["DELAY"])

          if not 1 <= workers <= 15:
              print("::error::workers must be between 1 and 15")
              sys.exit(1)
          if pages < 1:
              print("::error::pages must be >= 1")
              sys.exit(1)
          if delay < 0:
              print("::error::delay must be >= 0")
              sys.exit(1)

          print(f"workers={workers} pages={pages} delay={delay}")
          PY

      - name: Build worker matrix
        id: matrix
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          workers = int(os.environ["WORKERS"])
          print("matrix=" + json.dumps({"worker": [f"w-{i}" for i in range(1, workers + 1)]}))
          PY

  scrape:
    name: Worker ${{ matrix.worker }}
    needs: setup

    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout user repository
        uses: actions/checkout@v4
        with:
          path: user_repo
          fetch-depth: 1

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: praisethefool7/Dork-results
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Validate dorks
        working-directory: user_repo
        run: |
          set -euo pipefail
          if [ ! -f dorks.txt ]; then
            echo "::error::dorks.txt not found"
            exit 1
          fi
          if ! grep -qve '^[[:space:]]*$' dorks.txt; then
            echo "::error::dorks.txt is empty"
            exit 1
          fi
          COUNT="$(grep -cve '^[[:space:]]*$' dorks.txt || true)"
          echo "Dorks available: ${COUNT}"

      - name: Inject assigned dorks
        run: |
          set -euo pipefail
          cp user_repo/dorks.txt source/dorks.txt
          test -s source/dorks.txt
          if [ -n "${{ inputs.job_id }}" ]; then
            printf '%s\n' "${{ inputs.job_id }}" > source/.brain_hub_job_id
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install playwright ddddocr
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            unzip \
            wget

      - name: Install cloudflared
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Prepare Raptor extension (Buster never loaded)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          EXT_DIR="/tmp/free-ai-recaptcha-solver"
          EXTRACT_DIR="/tmp/free-ai-recaptcha-solver-extracted"
          RECONSTRUCTED="/tmp/free-ai-recaptcha-solver.bin"

          echo "========================================"
          echo "      RAPTOR EXTENSION PREPARATION"
          echo "========================================"

          rm -rf "${EXT_DIR}" "${EXTRACT_DIR}" "${RECONSTRUCTED}"
          mkdir -p "${EXT_DIR}" "${EXTRACT_DIR}"

          for PART in extension.bin.1 extension.bin.2 extension.bin.3; do
            if [ ! -f "${PART}" ]; then
              echo "::error::${PART} not found"
              exit 1
            fi
            echo "${PART} exists ($(stat -c %s "${PART}") bytes)"
          done

          cat extension.bin.1 extension.bin.2 extension.bin.3 > "${RECONSTRUCTED}"
          echo "Reconstructed: $(stat -c %s "${RECONSTRUCTED}") bytes"

          python3 - "${RECONSTRUCTED}" <<'PY'
          import sys
          from pathlib import Path
          archive = Path(sys.argv[1])
          with archive.open("rb") as f:
              magic = f.read(4)
          print(f"magic: {magic.hex()}")
          if magic not in (b"PK\x03\x04", b"PK\x05\x06", b"PK\x07\x08"):
              print("::error::not a ZIP")
              sys.exit(1)
          PY

          if ! unzip -t "${RECONSTRUCTED}" > /tmp/unzip-test.log 2>&1; then
            echo "::error::ZIP validation failed"
            cat /tmp/unzip-test.log
            exit 1
          fi

          unzip -q "${RECONSTRUCTED}" -d "${EXTRACT_DIR}"

          if [ -f "${EXTRACT_DIR}/manifest.json" ]; then
            BASE_DIR="${EXTRACT_DIR}"
          else
            BASE_MANIFEST="$(find "${EXTRACT_DIR}" -type f -name 'manifest.json' -print -quit)"
            if [ -z "${BASE_MANIFEST}" ]; then
              echo "::error::no manifest.json"
              exit 1
            fi
            BASE_DIR="$(dirname "${BASE_MANIFEST}")"
          fi

          rm -rf "${EXT_DIR}"
          mkdir -p "${EXT_DIR}"
          cp -a "${BASE_DIR}/." "${EXT_DIR}/"

          echo "Fetching CaptchaRaptor WS addon..."
          rm -rf /tmp/captchaplugin
          git clone --depth 1 \
            https://github.com/CaptchaRaptor/captchaplugin.git \
            /tmp/captchaplugin

          mkdir -p "${EXT_DIR}/ws"
          cp /tmp/captchaplugin/ws-addon/ws/background_ws.js "${EXT_DIR}/ws/background_ws.js"
          cp /tmp/captchaplugin/ws-addon/ws/offscreen.html "${EXT_DIR}/ws/offscreen.html"
          cp /tmp/captchaplugin/ws-addon/ws/offscreen.js "${EXT_DIR}/ws/offscreen.js"
          cp /tmp/captchaplugin/ws-addon/ws/recaptcha_frame_watch.js "${EXT_DIR}/ws/recaptcha_frame_watch.js"
          cp /tmp/captchaplugin/ws-addon/manifest.json "${EXT_DIR}/manifest.json"

          FINAL_MANIFEST="${EXT_DIR}/manifest.json"

          python3 - "${FINAL_MANIFEST}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          name = str(data.get("name", ""))
          background = data.get("background", {}) or {}
          service_worker = background.get("service_worker")
          permissions = set(data.get("permissions", []))

          print(f"name: {name}")
          print(f"version: {data.get('version')}")
          print(f"service_worker: {service_worker}")
          print(f"permissions: {sorted(permissions)}")

          lowered = name.lower()
          if "buster" in lowered:
              print("::error::BUSTER DETECTED")
              sys.exit(1)
          if not ("captcharaptor" in lowered or "raptor" in lowered or "free ai recaptcha solver" in lowered):
              print(f"::error::Unknown extension: {name!r}")
              sys.exit(1)
          if service_worker != "background.js":
              print(f"::error::Unexpected SW: {service_worker!r}")
              sys.exit(1)
          missing = {"tabs", "debugger", "offscreen"} - permissions
          if missing:
              print(f"::error::missing perms: {sorted(missing)}")
              sys.exit(1)
          print("Raptor WS manifest validation: OK")
          PY

          echo "Raptor extension ready"

      - name: Check CaptchaPlugin API key secret
        env:
          CAPTCHA_PLUGIN_API_KEY: ${{ secrets.CAPTCHA_PLUGIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CAPTCHA_PLUGIN_API_KEY}" ]; then
            echo "::error::CAPTCHA_PLUGIN_API_KEY missing"
            exit 1
          fi
          echo "CAPTCHA_PLUGIN_API_KEY is configured"

      - name: Verify worker
        working-directory: source
        run: |
          set -euo pipefail

          echo "Worker dir:"
          ls -la worker/

          test -f worker/worker.py
          test -f worker/text_captcha.py

          python3 -m py_compile \
            worker/worker.py \
            worker/text_captcha.py

          echo "worker.py + text_captcha.py syntax: OK"

      - name: Verify Raptor extension
        run: |
          set -euo pipefail
          EXT_DIR="/tmp/free-ai-recaptcha-solver"
          test -d "${EXT_DIR}"
          test -f "${EXT_DIR}/manifest.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/free-ai-recaptcha-solver/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          name = str(data.get("name", "")).lower()
          if "buster" in name:
              raise SystemExit("BUSTER DETECTED")
          if not ("captcharaptor" in name or "raptor" in name or "free ai recaptcha solver" in name):
              raise SystemExit(f"Unknown extension: {name!r}")
          print("Raptor verify OK")
          PY

      - name: Run worker
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKER: ${{ matrix.worker }}
          WORKERS: ${{ inputs.workers }}
          PAGES: ${{ inputs.pages }}
          DELAY: ${{ inputs.delay }}
          EXTENSION_PATH: /tmp/free-ai-recaptcha-solver
          CAPTCHA_SOLVER: "CaptchaRaptor WS"
          CAPTCHA_PLUGIN_API_KEY: ${{ secrets.CAPTCHA_PLUGIN_API_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "          DORK SWARM WORKER v5.0"
          echo "     (text-first → Raptor → tunnel)"
          echo "========================================"

          echo "Worker:     ${WORKER}"
          echo "Workers:    ${WORKERS}"
          echo "Pages:      ${PAGES}"
          echo "Extension:  ${EXTENSION_PATH}"

          test -f worker/worker.py
          test -f worker/text_captcha.py

          xvfb-run \
            -a \
            --server-args="-screen 0 1280x900x24" \
            python3 worker/worker.py
