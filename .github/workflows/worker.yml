name: dork-swarm

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Number of workers (1-15)"
        required: true
        default: "5"
        type: string
      pages:
        description: "Pages per dork"
        required: true
        default: "5"
        type: string
      job_id:
        description: "Brain Hub job ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: brain-hub-${{ github.repository }}
  cancel-in-progress: false

jobs:
  setup:
    name: Prepare workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate inputs
        env:
          WORKERS: ${{ inputs.workers }}
          PAGES: ${{ inputs.pages }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          workers = int(os.environ["WORKERS"])
          pages = int(os.environ["PAGES"])
          if not 1 <= workers <= 15:
              print("::error::workers must be 1-15"); sys.exit(1)
          if pages < 1:
              print("::error::pages must be >=1"); sys.exit(1)
          print(f"workers={workers} pages={pages}")
          PY
      - name: Build worker matrix
        id: matrix
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          workers = int(os.environ["WORKERS"])
          print("matrix=" + json.dumps({"worker": [f"w-{i}" for i in range(1, workers + 1)]}))
          PY

  scrape:
    name: Worker ${{ matrix.worker }}
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4
        with:
          path: user_repo
          fetch-depth: 1

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: praisethefool7/Dork-results
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Validate dorks
        working-directory: user_repo
        run: |
          set -euo pipefail
          if [ ! -f dorks.txt ]; then echo "::error::dorks.txt missing"; exit 1; fi
          if ! grep -qve '^[[:space:]]*$' dorks.txt; then echo "::error::dorks.txt empty"; exit 1; fi
          echo "Dorks: $(grep -cve '^[[:space:]]*$' dorks.txt)"

      - name: Inject assigned dorks
        run: |
          set -euo pipefail
          cp user_repo/dorks.txt source/dorks.txt
          test -s source/dorks.txt
          if [ -n "${{ inputs.job_id }}" ]; then
            printf '%s\n' "${{ inputs.job_id }}" > source/.brain_hub_job_id
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install playwright ddddocr Pillow playwright-stealth
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb unzip wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb || true
          google-chrome --version || true

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Prepare Raptor extension
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          EXT_DIR="/tmp/free-ai-recaptcha-solver"
          EXTRACT_DIR="/tmp/free-ai-recaptcha-solver-extracted"
          RECONSTRUCTED="/tmp/free-ai-recaptcha-solver.bin"

          rm -rf "${EXT_DIR}" "${EXTRACT_DIR}" "${RECONSTRUCTED}"
          mkdir -p "${EXT_DIR}" "${EXTRACT_DIR}"

          for PART in extension.bin.1 extension.bin.2 extension.bin.3; do
            if [ ! -f "${PART}" ]; then echo "::error::${PART} not found"; exit 1; fi
            echo "${PART} ($(stat -c %s ${PART}) bytes)"
          done

          cat extension.bin.1 extension.bin.2 extension.bin.3 > "${RECONSTRUCTED}"
          python3 - "${RECONSTRUCTED}" <<'PY'
          import sys
          from pathlib import Path
          a = Path(sys.argv[1])
          with a.open("rb") as f: m = f.read(4)
          if m not in (b"PK\x03\x04", b"PK\x05\x06", b"PK\x07\x08"):
              print("::error::not a ZIP"); sys.exit(1)
          PY
          unzip -q "${RECONSTRUCTED}" -d "${EXTRACT_DIR}"

          if [ -f "${EXTRACT_DIR}/manifest.json" ]; then
            BASE_DIR="${EXTRACT_DIR}"
          else
            BASE_MANIFEST="$(find "${EXTRACT_DIR}" -type f -name 'manifest.json' -print -quit)"
            test -n "${BASE_MANIFEST}" || { echo "::error::no manifest"; exit 1; }
            BASE_DIR="$(dirname "${BASE_MANIFEST}")"
          fi

          rm -rf "${EXT_DIR}"
          mkdir -p "${EXT_DIR}"
          cp -a "${BASE_DIR}/." "${EXT_DIR}/"

          git clone --depth 1 https://github.com/CaptchaRaptor/captchaplugin.git /tmp/captchaplugin
          mkdir -p "${EXT_DIR}/ws"
          cp /tmp/captchaplugin/ws-addon/ws/background_ws.js "${EXT_DIR}/ws/background_ws.js"
          cp /tmp/captchaplugin/ws-addon/ws/offscreen.html "${EXT_DIR}/ws/offscreen.html"
          cp /tmp/captchaplugin/ws-addon/ws/offscreen.js "${EXT_DIR}/ws/offscreen.js"
          cp /tmp/captchaplugin/ws-addon/ws/recaptcha_frame_watch.js "${EXT_DIR}/ws/recaptcha_frame_watch.js"
          cp /tmp/captchaplugin/ws-addon/manifest.json "${EXT_DIR}/manifest.json"

          python3 - "${EXT_DIR}/manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          d = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          name = str(d.get("name", "")).lower()
          if "buster" in name: raise SystemExit("BUSTER DETECTED")
          if not ("captcharaptor" in name or "raptor" in name or "free ai recaptcha solver" in name):
              raise SystemExit(f"Unknown ext: {name}")
          print("Raptor manifest OK")
          PY

      - name: Check CaptchaPlugin API key
        env:
          CAPTCHA_PLUGIN_API_KEY: ${{ secrets.CAPTCHA_PLUGIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CAPTCHA_PLUGIN_API_KEY}" ]; then
            echo "::error::CAPTCHA_PLUGIN_API_KEY missing"; exit 1
          fi
          echo "CAPTCHA_PLUGIN_API_KEY present"

      - name: Verify worker
        working-directory: source
        run: |
          set -euo pipefail
          ls -la worker/
          test -f worker/worker.py
          test -f worker/text_captcha.py
          test -f worker/solver.html
          python3 -m py_compile worker/worker.py worker/text_captcha.py
          echo "syntax OK"

      - name: Verify Raptor extension
        run: |
          set -euo pipefail
          EXT_DIR="/tmp/free-ai-recaptcha-solver"
          test -d "${EXT_DIR}"
          test -f "${EXT_DIR}/manifest.json"
          echo "Raptor extension present"

      - name: Run worker
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKER: ${{ matrix.worker }}
          WORKERS: ${{ inputs.workers }}
          PAGES: ${{ inputs.pages }}
          EXTENSION_PATH: /tmp/free-ai-recaptcha-solver
          CAPTCHA_SOLVER: "CaptchaRaptor WS"
          CAPTCHA_PLUGIN_API_KEY: ${{ secrets.CAPTCHA_PLUGIN_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          GOOGLE_NID_COOKIE: ${{ secrets.GOOGLE_NID_COOKIE }}
        run: |
          set -euo pipefail
          echo "========================================"
          echo "          DORK SWARM WORKER v6.1"
          echo "     (text -> Raptor -> tunnel)"
          echo "========================================"
          test -f worker/worker.py
          test -f worker/text_captcha.py
          xvfb-run -a --server-args="-screen 0 1280x900x24" python3 worker/worker.py
